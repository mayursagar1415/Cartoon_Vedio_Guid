[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flat-puppet-studio"
version = "2.0.0"
description = "2D Kahani Cutout Character Animator with 2-bone IK, Action Library, and FFmpeg pipe encoding"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
fast = ["scipy>=1.11"]
dev = ["pytest>=8.0"]

[project.scripts]
flat-puppet = "flat_puppet.cli:main"
